name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build OlympiadQuizzer.slnx -c Release

      - name: Test
        run: dotnet test OlympiadQuizzer.slnx -c Release --no-build --logger "console;verbosity=normal"

  build-docker:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build Docker image
        run: docker build -f source/api/Dockerfile -t oq-api:ci-${{ github.sha }} .
