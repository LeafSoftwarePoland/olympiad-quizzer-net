name: version-bump
run-name: Version bump check for PR #${{ github.event.number }}

# Fires only on `opened`, never on `synchronize`. That is what stops the push below from
# re-triggering this workflow: the commit it makes is a synchronize event, which nothing listens to.
on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump patch when the branch version still matches main
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $propsPath = 'Directory.Build.props'

          function Get-Version([string]$content) {
            $match = [regex]::Match($content, '<Version>\s*([0-9]+)\.([0-9]+)\.([0-9]+)\s*</Version>')
            if (-not $match.Success) {
              throw "Directory.Build.props has no three-segment <Version> element."
            }
            return [pscustomobject]@{
              Major = [int]$match.Groups[1].Value
              Minor = [int]$match.Groups[2].Value
              Patch = [int]$match.Groups[3].Value
              Text  = "$($match.Groups[1].Value).$($match.Groups[2].Value).$($match.Groups[3].Value)"
            }
          }

          $branchContent = [System.IO.File]::ReadAllText($propsPath)
          $branch = Get-Version $branchContent

          # The base file is read out of git rather than the working tree, so this compares the
          # branch against what main actually holds right now.
          $baseContent = git show "origin/$env:BASE_REF`:$propsPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read $propsPath from origin/$env:BASE_REF."
          }
          $base = Get-Version ([string]::Join("`n", $baseContent))

          if ($branch.Text -ne $base.Text) {
            "Branch is $($branch.Text), $env:BASE_REF is $($base.Text) - already deliberate, leaving it alone." |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          $bumped = "$($branch.Major).$($branch.Minor).$($branch.Patch + 1)"
          $updated = $branchContent -replace '<Version>\s*[0-9]+\.[0-9]+\.[0-9]+\s*</Version>', "<Version>$bumped</Version>"

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($propsPath, $updated, $utf8NoBom)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $propsPath
          git commit -m "chore(version): bump to $bumped"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"

          "Bumped $($base.Text) to $bumped. **Pull before continuing work on this branch.**" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
