name: deploy-frontend
run-name: >-
  Deploy Frontend ${{ inputs.version != '' && format('v{0}', inputs.version) || '(auto patch bump)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version major.minor.patch — leave empty to auto-bump the patch'
        required: false
        default: ''

permissions:
  contents: write     # was: read — tag creation needs write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      backend:  ${{ steps.resolve.outputs.backend }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0      # tags are not fetched at depth 1

      - id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_backend="$(git tag --list 'backend-v*' | sed 's/^backend-v//' | sort -V | tail -n 1)"
          if [ -z "$latest_backend" ]; then
            latest_backend="0.0.0"
          fi

          if [ -n "$REQUESTED" ]; then
            if ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version '$REQUESTED' is not major.minor.patch."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/frontend-v$REQUESTED" >/dev/null; then
              echo "::error::Tag frontend-v$REQUESTED already exists."
              exit 1
            fi
            frontend="$REQUESTED"
          else
            latest="$(git tag --list 'frontend-v*' | sed 's/^frontend-v//' | sort -V | tail -n 1)"
            if [ -z "$latest" ]; then
              frontend="1.0.0"
            else
              major="${latest%%.*}"
              rest="${latest#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              frontend="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$latest_backend" >> "$GITHUB_OUTPUT"
          echo "### Deploy Frontend v$frontend (backend v$latest_backend)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: dotnet publish source/App/olympiad-quizzer-net.Client/olympiad-quizzer-net.Client.csproj -c Release -o publish-out

      - name: Rewrite base href, inject API URL and version, add Pages files
        shell: pwsh
        env:
          RENDER_API_URL:    ${{ secrets.RENDER_API_URL }}
          FRONTEND_VERSION:  ${{ needs.version.outputs.frontend }}
          BACKEND_VERSION:   ${{ needs.version.outputs.backend }}
        run: |
          $root = "publish-out/wwwroot"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $index = Join-Path $root "index.html"
          $html  = [System.IO.File]::ReadAllText($index)
          $html  = $html -replace '<base\s+href="[^"]*"\s*/?>', '<base href="/olympiad-quizzer-net/" />'
          [System.IO.File]::WriteAllText($index, $html, $utf8NoBom)

          Copy-Item $index (Join-Path $root "404.html") -Force
          [System.IO.File]::WriteAllText((Join-Path $root ".nojekyll"), "", $utf8NoBom)

          $cfg = '{ "ApiBaseUrl": "' + $env:RENDER_API_URL.TrimEnd('/') + '" }'
          [System.IO.File]::WriteAllText((Join-Path $root "appsettings.json"), $cfg, $utf8NoBom)

          $ver = '{ "frontend": "' + $env:FRONTEND_VERSION + '", "backend": "' + $env:BACKEND_VERSION + '" }'
          [System.IO.File]::WriteAllText((Join-Path $root "version.json"), $ver, $utf8NoBom)

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: publish-out/wwwroot

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  tag:
    needs: [version, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.frontend }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "frontend-v$VERSION" -m "Frontend release v$VERSION"
          git push origin "frontend-v$VERSION"
