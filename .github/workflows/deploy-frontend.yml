name: deploy-frontend
run-name: Deploy Frontend

# No version input. The version is whatever Directory.Build.props holds on the deployed commit —
# set it there and the deploy carries it. A run name cannot read a file, so it stays generic and
# the resolved version goes to the run summary.
on:
  workflow_dispatch:

permissions:
  contents: write     # was: read — tag creation needs write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = [System.IO.File]::ReadAllText('Directory.Build.props')
          $match = [regex]::Match($content, '<Version>\s*([0-9]+\.[0-9]+\.[0-9]+)\s*</Version>')
          if (-not $match.Success) {
            throw "Directory.Build.props has no three-segment <Version> element."
          }
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "### Deploy Frontend v$version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  build:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: dotnet publish source/App/olympiad-quizzer-net.App.Client/olympiad-quizzer-net.App.Client.csproj -c Release -o publish-out

      - name: Rewrite base href, inject API URL, add Pages files
        shell: pwsh
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          $root = "publish-out/wwwroot"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $index = Join-Path $root "index.html"
          $html  = [System.IO.File]::ReadAllText($index)
          $html  = $html -replace '<base\s+href="[^"]*"\s*/?>', '<base href="/olympiad-quizzer-net/" />'
          [System.IO.File]::WriteAllText($index, $html, $utf8NoBom)

          Copy-Item $index (Join-Path $root "404.html") -Force
          [System.IO.File]::WriteAllText((Join-Path $root ".nojekyll"), "", $utf8NoBom)

          $cfg = '{ "ApiBaseUrl": "' + $env:RENDER_API_URL.TrimEnd('/') + '" }'
          [System.IO.File]::WriteAllText((Join-Path $root "appsettings.json"), $cfg, $utf8NoBom)


      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: publish-out/wwwroot

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  tag:
    needs: [version, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The version no longer comes from tags, so redeploying the same commit is legitimate and
          # must not fail at the last step just because its tag already exists.
          if git ls-remote --exit-code --tags origin "frontend-v$VERSION" >/dev/null 2>&1; then
            echo "Tag frontend-v$VERSION already exists — redeploy of an unchanged version." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "frontend-v$VERSION" -m "Frontend release v$VERSION"
          git push origin "frontend-v$VERSION"
