name: deploy-backend
run-name: Deploy Backend

# No version input. The version is whatever Directory.Build.props holds on the deployed commit —
# set it there and the deploy carries it. A run name cannot read a file, so it stays generic and
# the resolved version goes to the run summary.
on:
  workflow_dispatch:

permissions:
  contents: write     # tag creation needs write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = [System.IO.File]::ReadAllText('Directory.Build.props')
          $match = [regex]::Match($content, '<Version>\s*([0-9]+\.[0-9]+\.[0-9]+)\s*</Version>')
          if (-not $match.Success) {
            throw "Directory.Build.props has no three-segment <Version> element."
          }
          $version = $match.Groups[1].Value
          "backend=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "### Deploy Backend v$version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  deploy:
    needs: [version]
    runs-on: self-hosted
    steps:
      - name: Trigger Render deploy hook
        shell: powershell
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          $r = Invoke-WebRequest -Uri $env:HOOK -Method POST -UseBasicParsing
          Write-Host "Deploy hook: $($r.StatusCode)"
          if ($r.StatusCode -ne 200) { exit 1 }

      - name: Wait for healthz
        shell: powershell
        run: |
          $url      = "https://olympiad-quizzer-net-api.onrender.com/healthz"
          $deadline = (Get-Date).AddMinutes(5)
          Start-Sleep -Seconds 30
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 20
              if ($r.StatusCode -eq 200) { Write-Host "healthz OK: $($r.Content)"; exit 0 }
            } catch { Write-Host "waiting..." }
            Start-Sleep -Seconds 15
          }
          Write-Error "healthz did not return 200 within 5 minutes"
          exit 1

  tag:
    needs: [version, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.backend }}
        run: |
          set -euo pipefail
          # The version no longer comes from tags, so redeploying the same commit is legitimate and
          # must not fail at the last step just because its tag already exists.
          if git ls-remote --exit-code --tags origin "backend-v$VERSION" >/dev/null 2>&1; then
            echo "Tag backend-v$VERSION already exists — redeploy of an unchanged version." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "backend-v$VERSION" -m "Backend release v$VERSION"
          git push origin "backend-v$VERSION"
